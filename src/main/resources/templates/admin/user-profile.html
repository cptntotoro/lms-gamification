<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ: Профиль пользователя</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/user-profile.css}">
    <style>
        /* Дополнительные стили для блока выбора курса и статистики */
        .course-selector {
            margin: 24px 0 32px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
        }
        .course-selector h3 {
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 1.3rem;
        }
        .selector-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: flex-end;
            margin-bottom: 20px;
        }
        .selector-row .form-group {
            flex: 1;
            min-width: 180px;
            margin-bottom: 0;
        }
        .selector-row .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #475569;
        }
        .course-stats {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-top: 16px;
            border: 1px solid #e2e8f0;
        }
        .course-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-top: 12px;
        }
        .course-stat-item {
            text-align: center;
            padding: 12px;
            background: #f1f5f9;
            border-radius: 12px;
        }
        .course-stat-label {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 6px;
        }
        .course-stat-value {
            font-size: 1.6rem;
            font-weight: 700;
            color: #111827;
        }
        .badge-group {
            background: #eef2ff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-family: monospace;
        }
        .loading-small {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #e2e8f0;
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container">
    <div th:if="${user}" class="profile-card">
        <div class="profile-header">
            <div class="avatar">
                <span th:text="${user.userId?.substring(0,1)?.toUpperCase()} ?: 'U'">U</span>
            </div>
            <div class="user-main-info">
                <h1 th:text="${user.userId}"></h1>
                <div class="meta-info">
                    <span class="id-badge" th:text="'UUID: ' + ${user.uuid}"></span></div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-item">
                <div class="stat-label">Общее количество очков</div>
                <div class="stat-value" th:text="${user.totalPoints} ?: '0'">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Текущий уровень</div>
                <div class="stat-value" th:text="${user.level} ?: '1'">1</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Дата регистрации</div>
                <div class="stat-value" th:text="${user.createdAt != null ? #temporals.format(user.createdAt, 'dd.MM.yyyy HH:mm') : '—'}"></div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Последнее обновление</div>
                <div class="stat-value" th:text="${user.updatedAt != null ? #temporals.format(user.updatedAt, 'dd.MM.yyyy HH:mm') : '—'}"></div>
            </div>
        </div>

        <div class="progress-section">
            <div class="progress-header">
                <span>Прогресс до следующего уровня</span>
                <span th:text="${user.totalPoints} + ' / ' + ${user.pointsToNextLevel} + ' XP'">0 / 0 XP</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar"
                     th:style="'width: ' + ${user.progressPercent} + '%'"
                     th:attr="data-progress=${user.progressPercent} + '%'"></div>
            </div>
            <div class="progress-text">
                Осталось <strong th:text="${user.pointsToNextLevel - user.totalPoints} + ' XP'"></strong>
                до уровня <strong th:text="${user.level + 1}"></strong>
            </div>
        </div>

        <!-- Блок выбора курса и статистики по курсу -->
        <div class="course-selector" id="courseSelectorBlock">
            <h3>📊 Статистика по курсу</h3>
            <div class="selector-row">
                <div class="form-group">
                    <label for="courseSelectProfile">Курс</label>
                    <select id="courseSelectProfile" class="demo-select">
                        <option value="">-- Загрузка курсов --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="groupIdInputProfile">Группа (опционально)</label>
                    <input type="text" id="groupIdInputProfile" placeholder="например, M-21-2" class="demo-select">
                </div>
                <div>
                    <button id="loadCourseStatsBtn" class="btn btn-primary" style="padding: 8px 16px;">Загрузить</button>
                </div>
            </div>
            <div id="courseStatsContainer" style="display: none;">
                <div class="course-stats">
                    <div class="course-stats-grid" id="courseStatsGrid">
                        <!-- динамически заполняется -->
                    </div>
                </div>
            </div>
            <div id="courseStatsError" class="error-message" style="display: none; margin-top: 12px;"></div>
        </div>
    </div>

    <!-- Блок ошибки внутри карточки -->
    <div th:if="${error}" class="error-message">
        <h2>Ошибка</h2>
        <p th:text="${error}">Пользователь не найден</p>
    </div>
</div>

<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/user-profile.js}"></script>
</body>
</html>
