<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лидерборд курса</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/leaderboard.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container">
    <h1 class="page-title">Демо панель</h1>

    <div class="card">
        <h2>Сценарии</h2>

        <div class="actions-bar">
            <button class="btn btn-primary" onclick="createEventType()">Создать тип события</button>
            <button class="btn btn-primary" onclick="sendQuiz()">Отправить Quiz</button>
            <button class="btn btn-primary" onclick="sendHomework()">Отправить Homework</button>
        </div>
    </div>

    <div class="card" style="margin-top:20px;">
        <h2>LMS Simulator</h2>

        <button class="btn btn-primary" onclick="sendEvent('quiz')">Quiz</button>
        <button class="btn btn-primary" onclick="sendEvent('attendance')">Attendance</button>
        <button class="btn btn-primary" onclick="sendEvent('project')">Project</button>
    </div>
</div>

<div class="card" style="margin-top:20px;">
    <h2>Лог событий</h2>
    <div id="eventLog" class="event-log"></div>
</div>

<script th:src="@{/js/demo.js}"></script>
<script>
    window.GamificationWidgetConfig = {
        // Базовый URL вашего сервера геймификации (обязательно)
        apiBaseUrl: "http://localhost:8080",

        // ID текущего пользователя из LMS (обязательно)
        userId: localStorage.getItem("demoUserId") || "student001",                                 // <-- ЗАМЕНИТЕ НА РЕАЛЬНЫЙ ID

        // Частота обновления виджета в миллисекундах (опционально, по умолчанию 5000)
        updateIntervalMs: 5000,

        // // Дополнительные HTTP-заголовки (опционально). Например, для JWT-токена.
        // // Если ваш API требует авторизации через заголовок X-User-Id, его тоже можно передать здесь.
        headers: {
            "X-User-Id": localStorage.getItem("demoUserId") || "student001",      // Тот же ID, что и в userId
            "X-Role": "STUDENT"         // Если API требует роль (опционально)
        }
    };
</script>
<script th:src="@{/js/gamification-widget.js}"></script>

</body>
</html>
