<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Демо-панель геймификации</title>
    <link rel="stylesheet" th:href="@{/css/colors.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/leaderboard.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container">
    <h1 class="page-title">Демо-панель геймификации</h1>

    <!-- Сценарии тестирования -->
    <div class="card">
        <h2>Сценарии тестирования</h2>
        <p class="help-text">Нажмите на любой сценарий — откроется форма для отправки события. Все поля будут предварительно настроены под выбранный кейс.</p>
        <div class="scenarios-grid">
            <button class="scenario-btn btn btn-secondary" data-scenario="existing">1. Существующий пользователь, курс, группа</button>
            <button class="scenario-btn btn btn-secondary" data-scenario="newUser">2. Новый пользователь + новый курс + новая группа</button>
            <button class="scenario-btn btn btn-secondary" data-scenario="newCourse">3. Новый курс для существующего пользователя</button>
            <button class="scenario-btn btn btn-secondary" data-scenario="duplicate">4. Дубликат eventId (ошибка)</button>
            <button class="scenario-btn btn btn-secondary" data-scenario="emptyEventId">5. Пустой eventId (ошибка)</button>
            <button class="scenario-btn btn btn-secondary" data-scenario="invalidType">6. Неверный тип события (ошибка)</button>
            <button class="scenario-btn btn btn-secondary" data-scenario="invalidToken">7. Неверный токен (ошибка)</button>
        </div>
    </div>

    <!-- Лог событий -->
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h2 style="margin: 0;">Лог запросов и ответов</h2>
            <button id="clearLogBtn" class="btn btn-secondary">Очистить лог</button>
        </div>
        <div id="eventLog" class="event-log">
            <div class="log-item log-info">[--:--:--] Готов к демонстрации. Выберите сценарий и отправьте событие.</div>
        </div>
    </div>
</div>

<script th:src="@{/js/demo.js}"></script>
<script th:src="@{/js/gamification-widget.js}"></script>
<script>
    function getConfig() {
        return window.GamificationAPI.getWidgetConfig();
    }
    window.initGamificationWidget(getConfig());
    document.addEventListener('userChanged', () => {
        window.initGamificationWidget(getConfig());
    });
</script>
</body>
</html>
