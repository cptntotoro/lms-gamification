<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лидерборд курса</title>
    <link rel="stylesheet" th:href="@{/css/colors.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/leaderboard.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container">
    <h1 class="page-title">Лидерборд курса</h1>

    <!-- Отображение текущего пользователя -->
    <div class="current-user-bar" id="currentUserBar">
        <span class="current-user-label">Просмотр для пользователя:</span>
        <span class="current-user-id" id="currentUserIdDisplay">—</span>
    </div>

    <!-- Блок выбора курса и группы -->
    <div class="selector-panel">
        <div class="selector-row">
            <div class="form-group">
                <label for="leaderboardCourseSelect">Курс *</label>
                <select id="leaderboardCourseSelect" class="demo-select" required>
                    <option value="">-- Загрузка курсов --</option>
                </select>
            </div>
            <div class="form-group">
                <label for="leaderboardGroupSelect">Группа (опционально)</label>
                <select id="leaderboardGroupSelect" class="demo-select">
                    <option value="">-- Все группы --</option>
                </select>
            </div>
            <div>
                <button id="loadLeaderboardBtn" class="btn btn-primary">Загрузить</button>
            </div>
        </div>
        <div class="help-text">
            Выберите курс, чтобы увидеть рейтинг участников. Группу можно не указывать — будет показан общий лидерборд курса.
            Записанные курсы и группы отмечены символом ✓.
        </div>
    </div>

    <!-- Контейнер для лидерборда -->
    <div id="leaderboardContainer">
        <div class="loading-overlay">Выберите курс и нажмите «Загрузить»</div>
    </div>
</div>

<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/leaderboard.js}"></script>
</body>
</html>
